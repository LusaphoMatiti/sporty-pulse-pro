name: Dispatch scheduled notifications

# Vercel Hobby caps every cron entry (native to vercel.json) at once
# per day, so it can't run the dispatcher's 10-15 min polling loop.
# That cap only applies to Vercel's own scheduler though -- the route
# itself is a normal authenticated HTTP endpoint, so this workflow
# hits it from GitHub Actions instead.
#

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

env:
  DISPATCH_URL: https://YOUR_DOMAIN_HERE/api/cron/notifications/dispatch

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$DISPATCH_URL"
